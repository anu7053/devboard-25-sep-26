name: GitHub Actions Test Run

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Test Check
        run: |
          echo "Running unit tests..."
          echo "All tests passed successfully!"

      - name: Build Application
        run: |
          echo "Compiling code and building project artifacts..."
          mkdir output
          echo "Built successfully at $(date)" > output/build-log.txt

      - name: Save Build Output
        uses: actions/upload-artifact@v4
        with:
          name: demo-build-artifact
          path: output/













































































































































































































































  


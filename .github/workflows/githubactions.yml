name: GitHub Actions Verification

on: [push, pull_request]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Download Code from Repo
        uses: actions/checkout@v4

      - name: 2. Verify Actions Environment
        run: |
          echo "========================================="
          echo "SUCCESS: GitHub Actions is working!"
          echo "Triggered by event: ${{ github.event_name }}"
          echo "Running on OS: Ubuntu Linux"
          echo "========================================="

      - name: 3. List Current Files
        run: |
          echo "Here are the files currently in your repository:"
          ls -la
